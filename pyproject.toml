[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "legal-ai"
version = "0.7.0"
description = "Multimodal Legal Assistant — OCR, HTR, ASR, Fusion, RAG, LLM & Response Pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
ocr = [
    "pymupdf>=1.24.0",          # PyMuPDF — hybrid PDF text extraction
    "paddlepaddle>=2.6.0",      # PaddleOCR backend (CPU); use paddlepaddle-gpu for GPU
    "paddleocr>=2.7.3",         # PaddleOCR engine
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.3.0",
    "numpy>=1.26.0",
    "langdetect>=1.0.9",
    "pydantic>=2.7.0",
]
htr = [
    "legal-ai[ocr]",            # reuses preprocessor + BoundingBox from Module 1
    "transformers>=4.40.0",     # TrOCR VisionEncoderDecoderModel
    "torch>=2.2.0",             # PyTorch (CPU by default)
    "symspellpy>=6.7.7",        # SymSpell spell correction (optional but recommended)
]
asr = [
    "openai-whisper>=20231117", # Whisper ASR (primary engine)
    "soundfile>=0.12.1",        # fast WAV/FLAC/OGG loader
    "pydub>=0.25.1",            # MP3/M4A loader (requires ffmpeg on PATH)
    "scipy>=1.12.0",            # high-quality resampling
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
]
asr-fast = [
    "legal-ai[asr]",
    "faster-whisper>=1.0.3",    # CTranslate2 optimised Whisper (2–4× faster on CPU)
]
api = [
    "legal-ai[ocr]",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",  # multipart/form-data uploads
]
tesseract = [
    "pytesseract>=0.3.13",      # optional Tesseract adapter (OCR fallback + Devanagari HTR)
]
layoutparser = [
    "layoutparser>=0.3.4",      # optional heavy layout engine
    "detectron2",               # must be installed from source per platform
]
yolov8 = [
    "ultralytics>=8.2.0",       # YOLOv8 handwriting segmenter (opt-in)
]
dev = [
    "legal-ai[ocr,htr,asr,api]",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",            # async test client for FastAPI
    "Faker>=25.0.0",
]
rag = [
    "sentence-transformers>=2.7.0",  # SentenceTransformerEmbedder (all-MiniLM-L6-v2)
    "chromadb>=0.5.0",               # ChromaVectorStore persistent backend
    "faiss-cpu>=1.8.0",              # optional FAISS backend (large-scale)
]
llm = [
    "google-genai>=1.0.0",           # GeminiEngine (gemini-2.0-flash)
]
response = [
    # No extra runtime deps — uses only stdlib (html, re) + pydantic
]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["modules", "api"]
omit = ["tests/*", "scripts/*"]

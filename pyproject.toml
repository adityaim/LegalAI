[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "legal-ai"
version = "0.2.0"
description = "Multimodal Legal Assistant — Module 1: OCR Document Reader, Module 2: HTR Handwriting Reader"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
ocr = [
    "pymupdf>=1.24.0",          # PyMuPDF — hybrid PDF text extraction
    "paddlepaddle>=2.6.0",      # PaddleOCR backend (CPU); use paddlepaddle-gpu for GPU
    "paddleocr>=2.7.3",         # PaddleOCR engine
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.3.0",
    "numpy>=1.26.0",
    "langdetect>=1.0.9",
    "pydantic>=2.7.0",
]
htr = [
    "legal-ai[ocr]",            # reuses preprocessor + BoundingBox from Module 1
    "transformers>=4.40.0",     # TrOCR VisionEncoderDecoderModel
    "torch>=2.2.0",             # PyTorch (CPU by default)
    "symspellpy>=6.7.7",        # SymSpell spell correction (optional but recommended)
]
api = [
    "legal-ai[ocr]",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",  # multipart/form-data uploads
]
tesseract = [
    "pytesseract>=0.3.13",      # optional Tesseract adapter (OCR fallback + Devanagari HTR)
]
layoutparser = [
    "layoutparser>=0.3.4",      # optional heavy layout engine
    "detectron2",               # must be installed from source per platform
]
yolov8 = [
    "ultralytics>=8.2.0",       # YOLOv8 handwriting segmenter (opt-in)
]
dev = [
    "legal-ai[ocr,htr,api]",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",            # async test client for FastAPI
    "Faker>=25.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["modules", "api"]
omit = ["tests/*", "scripts/*"]
